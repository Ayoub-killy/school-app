{% extends 'base.html' %}
{% block title %}Book Categories - School App{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Book Categories</h3>
    <a href="{% url 'library:bookcategory_create' %}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Add Category</a>
</div>
<div class="card shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light"><tr><th>Name</th><th>Actions</th></tr></thead>
            <tbody>
                {% for cat in categories %}
                <tr>
                    <td>{{ cat.name }}</td>
                    <td>
                        <a href="{% url 'library:bookcategory_update' cat.pk %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        <a href="{% url 'library:bookcategory_delete' cat.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="2" class="text-center text-muted py-4">No categories yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

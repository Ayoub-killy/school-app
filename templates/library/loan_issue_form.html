{% extends 'base.html' %}
{% block title %}Issue Book - School App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header"><h4 class="mb-0">Issue Book</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Book Copy (available only)</label>{{ form.book_copy }}</div>
                    <div class="mb-3"><label class="form-label">Member</label>{{ form.member }}</div>
                    <div class="mb-3"><label class="form-label">Borrowed Date</label>{{ form.borrowed_date }}</div>
                    <div class="mb-3"><label class="form-label">Due Date</label>{{ form.due_date }}</div>
                    <button type="submit" class="btn btn-primary">Issue Book</button>
                    <a href="{% url 'library:loan_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

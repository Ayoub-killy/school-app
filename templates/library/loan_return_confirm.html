{% extends 'base.html' %}
{% block title %}Return Book - School App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-success shadow-sm">
            <div class="card-header bg-success text-white"><i class="bi bi-arrow-return-left"></i> Confirm Return</div>
            <div class="card-body">
                <p>Mark <strong>{{ loan.book_copy }}</strong> (borrowed by {{ loan.member }}) as returned today?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-success">Yes, Mark Returned</button>
                    <a href="{% url 'library:loan_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

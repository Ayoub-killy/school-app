{% extends 'base.html' %}
{% block title %}Students by Class - School App{% endblock %}

{% block content %}
<h3 class="mb-4">Students by Class</h3>

<div class="row g-3">
    {% for sc in classes %}
    <div class="col-6 col-md-4 col-lg-3">
        <a href="{% url 'sis:class_students' sc.id %}" class="text-decoration-none">
            <div class="card shadow-sm h-100 text-center">
                <div class="card-body">
                    <i class="bi bi-mortarboard fs-1 text-primary"></i>
                    <h5 class="card-title mt-2">{{ sc.name }}</h5>
                    <span class="badge text-bg-primary fs-6">{{ sc.student_count }} student{{ sc.student_count|pluralize }}</span>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}

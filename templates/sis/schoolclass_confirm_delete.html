{% extends 'base.html' %}
{% block title %}Delete Class - School App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> Confirm Deletion
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete <strong>{{ school_class.name }}</strong>? Any streams under this class will also be affected.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'sis:schoolclass_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

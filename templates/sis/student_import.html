{% extends 'base.html' %}
{% block title %}Import Students - School App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header"><h4 class="mb-0"><i class="bi bi-file-earmark-excel me-2 text-success"></i>Import Students from Excel</h4></div>
                            <div class="d-grid mb-3">
                    <a href="{% url 'sis:student_import_template' %}" class="btn btn-outline-success">
                        <i class="bi bi-download me-1"></i> Download Excel Template
                    </a>
                </div>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Excel File (.xlsx)</label>
                        {{ form.excel_file }}
                    </div>
                    <button type="submit" class="btn btn-success"><i class="bi bi-upload me-1"></i> Import</button>
                    <a href="{% url 'sis:student_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

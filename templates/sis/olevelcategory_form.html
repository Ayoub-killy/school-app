{% extends 'base.html' %}
{% block title %}{% if category %}Edit{% else %}Add{% endif %} O-Level Category - School App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header"><h4 class="mb-0">{% if category %}Edit{% else %}Add{% endif %} O-Level Category</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Name</label>{{ form.name }}</div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'sis:olevelcategory_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

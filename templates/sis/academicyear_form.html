{% extends 'base.html' %}
{% block title %}{% if year %}Edit{% else %}Add{% endif %} Academic Year - School App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header"><h4 class="mb-0">{% if year %}Edit{% else %}Add{% endif %} Academic Year</h4></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Year</label>{{ form.year }}</div>
                    <div class="form-check mb-3">{{ form.is_active }}<label class="form-check-label">Active</label></div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="{% url 'sis:academicyear_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
